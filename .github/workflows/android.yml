name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;25.1.8937393"

    - name: Generate Gradle wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.5

    - name: Clone MNN
      run: |
        git clone --depth 1 https://github.com/alibaba/MNN.git $HOME/MNN

    - name: Build MNN for Android arm64
      run: |
        cd $HOME/MNN
        mkdir -p build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.1.8937393/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DMNN_BUILD_LLM=ON \
          -DMNN_ARM82=OFF \
          -DMNN_SUPPORT_BF16=ON \
          -DMNN_LOW_MEMORY=ON
        make -j$(nproc)
        echo "=== MNN build results ==="
        find $HOME/MNN/build -name "libMNN*" -o -name "libllm*" 2>/dev/null

    - name: Find MNN library path
      id: mnn
      run: |
        MNN_LIB=$(find $HOME/MNN/build -name "libMNN.so" | head -1)
        LLM_LIB=$(find $HOME/MNN/build -name "libllm.so" | head -1)
        if [ -z "$MNN_LIB" ]; then
          echo "::error::libMNN.so not found"
          exit 1
        fi
        if [ -z "$LLM_LIB" ]; then
          echo "::error::libllm.so not found"
          exit 1
        fi
        echo "MNN_LIB=$MNN_LIB" >> $GITHUB_OUTPUT
        echo "MNN_LLM_LIB=$LLM_LIB" >> $GITHUB_OUTPUT
        echo "Found MNN library at: $MNN_LIB"
        echo "Found LLM library at: $LLM_LIB"

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        rm -rf app/.cxx
        ./gradlew assembleDebug \
          -PMNN_ROOT=$HOME/MNN \
          -DMNN_LIB=${{ steps.mnn.outputs.MNN_LIB }} \
          -DMNN_LLM_LIB=${{ steps.mnn.outputs.MNN_LLM_LIB }}
        echo "=== APK output ==="
        find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APKs found"

    - name: Upload APK
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: mnn-server-android
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/*.apk
        tag_name: android-${{ github.sha }}
        name: "MNN LLM Server Android"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

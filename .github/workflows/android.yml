name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;25.1.8937393"

    - name: Generate Gradle wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.5

    - name: Clone MNN
      run: |
        git clone --depth 1 https://github.com/alibaba/MNN.git $HOME/MNN

    - name: Build MNN for Android arm64
      run: |
        cd $HOME/MNN
        mkdir -p build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.1.8937393/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DMNN_BUILD_LLM=ON \
          -DMNN_SUPPORT_BF16=ON \
          -DMNN_LOW_MEMORY=ON
        make -j$(nproc)
        echo "=== Build output ==="
        ls -la $HOME/MNN/build/*.so 2>/dev/null || echo "No .so files"
        ls -la $HOME/MNN/build/*.a 2>/dev/null || echo "No .a files"

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        rm -rf app/.cxx
        ./gradlew assembleRelease \
          -PMNN_ROOT=$HOME/MNN

    - name: Upload APK
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: mnn-server-android
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/release/*.apk
        tag_name: android-${{ github.sha }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
